user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /dev/stdout;
  sendfile on;
  server_tokens off;
  client_max_body_size 10m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;

  upstream users    { server 127.0.0.1:3333; }
  upstream workouts { server 127.0.0.1:3334; }
  upstream notify   { server 127.0.0.1:3335; }

  server {
    listen 80 default_server;

    root /app/www;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Префиксы маршрутов сервисов не пересекаются, всё остальное под /api — 404.
    location ~ ^/api/auth(/|$) {
      limit_req zone=auth burst=20 nodelay;
      proxy_pass http://users;
    }
    location ~ ^/api/(users|personal-account)(/|$) {
      proxy_pass http://users;
    }
    location ~ ^/api/(workouts|files)(/|$) {
      proxy_pass http://workouts;
    }
    location ~ ^/api/workout-subscriber(/|$) {
      proxy_pass http://notify;
    }
    location /api/ {
      return 404;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
