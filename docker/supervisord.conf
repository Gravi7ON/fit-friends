[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

; ------------------------------------------------------------ infrastructure

[program:postgres]
command=/usr/lib/postgresql/current/bin/postgres -D /data/postgres -c listen_addresses=127.0.0.1 -c unix_socket_directories=/var/run/postgresql
user=postgres
priority=10
stopsignal=INT
stopwaitsecs=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:mongodb]
command=/usr/bin/mongod --dbpath /data/mongo --bind_ip 127.0.0.1 --port 27017 --auth
user=mongodb
priority=10
stopwaitsecs=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:redis]
command=/usr/bin/redis-server --bind 127.0.0.1 --port 6379 --protected-mode yes --dir /data/redis --save 300 1 --daemonize no
user=redis
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:rabbitmq]
command=/usr/sbin/rabbitmq-server
user=rabbitmq
environment=HOME="/var/lib/rabbitmq",ERL_EPMD_ADDRESS="127.0.0.1"
priority=10
stopwaitsecs=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:mailpit]
command=/usr/local/bin/mailpit
user=app
environment=MP_SMTP_BIND_ADDR="127.0.0.1:1025",MP_UI_BIND_ADDR="127.0.0.1:8025",MP_SMTP_AUTH_ACCEPT_ANY="true",MP_SMTP_AUTH_ALLOW_INSECURE="true",MP_DATABASE="/data/mailpit/mailpit.db"
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; ------------------------------------------------------------------ backend

[program:users]
command=/app/docker/run-service.sh users
user=app
priority=50
startretries=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:workouts]
command=/app/docker/run-service.sh workouts
user=app
priority=50
startretries=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:notify]
command=/app/docker/run-service.sh notify
user=app
priority=50
startretries=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; ----------------------------------------------------------------- frontend

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=90
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
